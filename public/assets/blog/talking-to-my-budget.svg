<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Talking to my budget cover</title>
  <desc id="desc">A graphic cosmic interface with speech waves, budget blocks, and orbiting stars.</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#172233"/>
      <stop offset="60%" stop-color="#0f121a"/>
      <stop offset="100%" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="voice" x1="256" y1="122" x2="904" y2="514" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5efe2"/>
      <stop offset="0.5" stop-color="#6b9eff"/>
      <stop offset="1" stop-color="#2d5bd7"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8b5"/>
      <stop offset="1" stop-color="#bd8254"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#d9e6ff" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="600" cy="314" rx="420" ry="162" fill="none" stroke="#6b9eff" stroke-opacity="0.14" stroke-width="1.5" transform="rotate(-12 600 314)"/>
  <ellipse cx="600" cy="314" rx="322" ry="112" fill="none" stroke="url(#voice)" stroke-opacity="0.45" stroke-width="2.2" transform="rotate(16 600 314)"/>
  <g transform="translate(384 150)">
    <rect x="0" y="0" width="432" height="330" rx="34" fill="#0d1119" stroke="#6b9eff" stroke-opacity="0.25"/>
    <rect x="38" y="46" width="188" height="42" rx="14" fill="#f5efe2" opacity="0.9"/>
    <rect x="38" y="112" width="142" height="28" rx="10" fill="#6b9eff" opacity="0.48"/>
    <rect x="38" y="162" width="246" height="28" rx="10" fill="#6b9eff" opacity="0.24"/>
    <rect x="38" y="212" width="316" height="28" rx="10" fill="#6b9eff" opacity="0.18"/>
    <rect x="278" y="44" width="98" height="98" rx="24" fill="url(#coin)"/>
    <circle cx="327" cy="93" r="28" fill="#0d1119" opacity="0.18"/>
    <path d="M314 93 H340 M327 80 V106" stroke="#0d1119" stroke-opacity="0.56" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" transform="translate(210 224)">
    <path d="M0 92 C42 18 92 18 134 92 C176 166 226 166 268 92" stroke="url(#voice)" stroke-width="9"/>
    <path d="M28 92 C58 48 88 48 118 92 C148 136 178 136 208 92" stroke="#f5efe2" stroke-opacity="0.7" stroke-width="5"/>
  </g>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" transform="translate(792 270)">
    <path d="M0 50 C32 8 64 8 96 50 C128 92 160 92 192 50" stroke="#6b9eff" stroke-width="8"/>
    <path d="M32 50 C54 26 76 26 98 50 C120 74 142 74 164 50" stroke="#f5efe2" stroke-opacity="0.52" stroke-width="4"/>
  </g>
  <g fill="#f5efe2">
