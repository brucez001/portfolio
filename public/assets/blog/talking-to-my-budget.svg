    <circle cx="1040" cy="144" r="2.5" opacity="0.85"/>
    <circle cx="1010" cy="502" r="1.8" opacity="0.72"/>
    <circle cx="252" cy="494" r="1.8" opacity="0.65"/>
    <circle cx="540" cy="96" r="1.5" opacity="0.56"/>
    <circle cx="728" cy="538" r="1.8" opacity="0.72"/>
  </g>
  <path d="M162 426 C300 342 398 368 512 462" fill="none" stroke="#f3d8a2" stroke-opacity="0.16" stroke-width="2"/>
