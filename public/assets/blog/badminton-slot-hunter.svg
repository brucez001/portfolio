  <ellipse cx="600" cy="315" rx="360" ry="118" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="2.4" transform="rotate(-17 600 315)"/>
  <ellipse cx="600" cy="315" rx="430" ry="158" fill="none" stroke="#6b9eff" stroke-opacity="0.11" stroke-width="1.5" transform="rotate(14 600 315)"/>
