<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Badminton Slot Hunter cover</title>
  <desc id="desc">A graphic cosmic composition with a shuttle, orbital calendar rings, and stars.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#192237"/>
      <stop offset="56%" stop-color="#10141f"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <linearGradient id="accent" x1="145" y1="96" x2="1000" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5efe2"/>
      <stop offset="0.48" stop-color="#91b7ff"/>
      <stop offset="1" stop-color="#2d5bd7"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d8a2"/>
      <stop offset="1" stop-color="#c58b5b"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#d9e6ff" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
